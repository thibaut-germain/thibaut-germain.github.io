role: Postdoctoral Researcher
bio: |
  My research combines machine learning and signal processing with geometric methods to study time series and dynamical systems.

  Since March 2025, I have been a postdoctoral researcher at [CMAP - Ecole Polytechnique](https://cmap.ip-paris.fr), working with [Karim Lounici](http://www.cmapx.polytechnique.fr/~karim.lounici/) and [Rémi Flamary](https://remi.flamary.com). My work combines operator learning and optimal transport to compare dynamical systems, uncover shared dynamical structure, and transfer knowledge across systems.

  Previously, I completed my PhD at [Centre Borelli](https://centreborelli.ens-paris-saclay.fr/en), under the supervision of [Charles Truong](https://charles.doffy.net) and [Laurent Oudre](http://www.laurentoudre.fr). I developed methods tailored for the discovery and statistical analysis of time series patterns with a particular focus on biomedical applications.

